---
- name: WebServer setup
  hosts: webservers
  become: yes
  tasks:
    - name: Install httpd
      ansible.builtin.yum:
        name: httpd
        state: present
    - name: Start Service
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    - name: Copying index.html to web server
      copy: 
        src: files/index.html
        dest: /var/www/html/index.html
        backup: yes

